    const spillEL = document.getElementById("spillID");
    const bilder = ["firkant", "trekant", "sirkel", "hjerte", "stjerne", "kryss", "rombe", "sekskant"];

    for(let i=0; i<bilder.length; i++) {
      let imgEL = document.createElement("img");
      imgEL.src = "media/" + bilder[i] + ".png";
      imgEL.alt = "Bilde av " + bilder[i];
      imgEL.width = "100";
      imgEL.height = "100";
      spillEL.appendChild(imgEL);
    }
