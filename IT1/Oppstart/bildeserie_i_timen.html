<!DOCTYPE html>
<html lang='no'>
<head>
  <meta charset='UTF-8'>
  <title>Bildeserie i timen</title>
</head>
<body>
  <img id="bildeID" src="media/firkant.png" alt="Bilde av en firkant" height="100" width="100">
  <script>
    const bildeEL = document.getElementById("bildeID");
    
    function bildeFunk() {
      bildeEL.src = "media/sirkel.png";
    }
    bildeEL.addEventListener("click",bildeFunk);

  </script>
</body>
</html>
